@if (alarmService.alarm()?.active) {
    <div class="alarm-banner" role="alert">
        <mat-icon>warning</mat-icon>
        <span>

            @if (alarmService.alarm()?.reason) {
                — {{ alarmService.alarm()!.reason }}
            }
    </span>
        <a routerLink="/security" class="alarm-link">Go to Security</a>
    </div>
}
